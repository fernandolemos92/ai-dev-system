version: 1
primary_runtime: opencode

runtime_targets:
  opencode:
    native_agent_dir: .opencode/agents
    invocation_prefix: "@"
    default_mode: subagent

agents:
  orchestrator:
    file: system/control/ORCHESTRATOR.md
    domain: control
    runtime_type: general
    invocation_mode: adapter
    adapter_note: Control orchestrator is executed as local procedure, not a native subagent.
    description: Runtime conductor that resolves scenario, phase, playbook, runbook, gates, specialists, and next movement.

  project-manager:
    file: system/agents/project-manager.md
    domain: planning
    runtime_type: opencode
    invocation_mode: native-or-adapted
    opencode_agent: project-manager
    adapter_note: Native OpenCode agent unavailable; fall back by reading and materially applying the specialist file.
    description: Sequencing, task shaping, execution boundaries, dependency ordering, and continuity support.

